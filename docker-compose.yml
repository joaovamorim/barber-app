version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis e RabbitMQ comentados por enquanto; habilite se necessário
  # redis:
  #   image: redis:7
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

  # rabbitmq:
  #   image: rabbitmq:3-management
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"

  api:
    build:
      context: ./src/Saas.Scheduler.Api
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=saas_dev;Username=saas;Password=saas_password
    ports:
      - "5000:80"
    volumes:
      - ./src/Saas.Scheduler.Api:/app
volumes:
  postgres-data:
